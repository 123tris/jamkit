# JamKit CI: edit-mode tests on every push, via game-ci.
#
# The package repo has no Unity project, so the workflow assembles a minimal one around the
# package and lists JamKit as testable (Unity only builds a package's tests when it is). JamKit
# needs nothing from the Asset Store, so that project needs only Ripple and JamKit's own
# Unity dependencies.
#
# Two prerequisites, then delete the `if: ${{ false }}` line (see ROADMAP, phase 1):
#   1. Ripple's v0.3.0 tag, which RIPPLE_GIT_URL points at.
#   2. A UNITY_LICENSE repository secret: https://game.ci/docs/github/activation

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  UNITY_VERSION: 6000.5.7f1
  RIPPLE_GIT_URL: "https://github.com/123tris/Ripple.git#v0.3.0"

jobs:
  test:
    name: Edit-mode tests (Unity ${{ env.UNITY_VERSION }})
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Assemble test project
        run: |
          mkdir -p project/Packages project/Assets project/ProjectSettings
          cp -r package project/Packages/com.metz.jamkit
          cat > project/Packages/manifest.json <<EOF
          {
            "dependencies": {
              "com.metz.jamkit": "file:com.metz.jamkit",
              "com.metz.ripple": "${RIPPLE_GIT_URL}",
              "com.unity.test-framework": "1.7.0"
            },
            "testables": ["com.metz.jamkit"]
          }
          EOF

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: project
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
